<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  
  <!-- Viewport: viewport-fit=cover enables edge-to-edge drawing under the notch and home indicator -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
  
  <!-- Standalone Web App Meta for iOS and Modern WebKit -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-touch-fullscreen" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Larp Tools" />
  
  <!-- Prevent iOS Safari from converting numbers/addresses into clickable phone links -->
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
  
  <!-- Theme color matching Trust Wallet's background tone (#0e111a) -->
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0e111a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#0e111a" />
  
  <!-- Static manifest link for iOS / WebKit discovery -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/jester.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/jester.png" />

  <title>Larp Tools</title>

  <!-- Inline critical CSS: locks canvas background and prevents sub-pixel white/gray flash on initial load -->
  <style>
    :root {
      color-scheme: dark;
    }
    html {
      height: 100%;
      height: -webkit-fill-available;
      background-color: #0e111a;
      margin: 0;
      padding: 0;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }
    body {
      height: 100%;
      min-height: 100%;
      min-height: -webkit-fill-available;
      margin: 0;
      padding: 0;
      background-color: #0e111a;
      color: #f5f6fa;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    #root {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0e111a;
    }
  </style>

  <!-- Prevents internal links from breaking standalone mode and launching Safari's browser chrome -->
  <script>
    (function(document, navigator, standalone) {
      if (standalone in navigator && navigator[standalone]) {
        var curnode, location = document.location, stop = /^(a|html)$/i;
        document.addEventListener('click', function(e) {
          curnode = e.target;
          while (!stop.test(curnode.nodeName)) {
            curnode = curnode.parentNode;
          }
          if (
            'href' in curnode &&
            (curnode.href.indexOf('http') || ~curnode.href.indexOf(location.host)) &&
            curnode.target !== '_blank' &&
            !curnode.getAttribute('download')
          ) {
            e.preventDefault();
            location.href = curnode.href;
          }
        }, false);
      }
    })(document, window.navigator, 'standalone');
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
